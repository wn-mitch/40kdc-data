# Project-local OMP settings for the 40kdc ability-DSL agent suite.
# The suite lives in .omp/agents (OMP task discovery skips .claude/agents), and its
# kroot shape-scout agents spawn helper agents themselves. Nested spawns need the
# recursion gate to allow depth-1 agents to spawn depth-2 helpers.
task:
  maxRecursionDepth: 3
  # Direct task-tool agents must never remain opaque for hours.
  maxRuntimeMs: 1800000
